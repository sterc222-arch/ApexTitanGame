name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instaliraj ovisnosti
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "Cython<3.0" buildozer

      - name: Postavi Java verziju
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pokreni Buildozer
        run: |
          yes | buildozer android debug

      - name: Spremi gotov APK
        uses: actions/upload-artifact@v4
        with:
          name: MojaAplikacija-APK
          path: bin/*.apk
